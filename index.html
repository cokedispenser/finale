<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listen and write</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F2ECDD;
    --card: #FBF8F0;
    --ink: #2B2620;
    --ink-soft: #6B6255;
    --teal: #2F6F62;
    --teal-dark: #234F45;
    --line: #DDD3BC;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(43,38,32,0.06) 1px, transparent 0);
    background-size: 22px 22px;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 36px 32px 32px;
    box-shadow: 0 1px 0 rgba(43,38,32,0.04);
  }

  .wave {
    display: flex;
    align-items: center;
    gap: 3px;
    height: 28px;
    margin-bottom: 18px;
  }

  .wave span {
    display: block;
    width: 3px;
    border-radius: 2px;
    background: var(--teal);
    opacity: 0.85;
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-size: 1.7rem;
    line-height: 1.25;
    margin: 0 0 8px;
  }

  p.lede {
    margin: 0 0 26px;
    color: var(--ink-soft);
    font-size: 0.95rem;
    line-height: 1.5;
    max-width: 38ch;
  }

  audio {
    width: 100%;
    margin-bottom: 6px;
    accent-color: var(--teal);
  }

  .hint {
    font-size: 0.82rem;
    color: var(--ink-soft);
    margin: 0 0 28px;
  }

  form {
    border-top: 1px solid var(--line);
    padding-top: 24px;
  }

  label {
    display: block;
    font-size: 0.95rem;
    font-weight: 500;
    margin-bottom: 10px;
  }

  textarea {
    width: 100%;
    min-height: 96px;
    resize: vertical;
    padding: 12px 14px;
    font-family: inherit;
    font-size: 0.98rem;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    line-height: 1.5;
  }

  textarea:focus {
    outline: 2px solid var(--teal);
    outline-offset: 1px;
  }

  button {
    margin-top: 16px;
    width: 100%;
    padding: 12px 18px;
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.98rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: var(--teal-dark); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .status {
    margin-top: 14px;
    font-size: 0.88rem;
    color: var(--teal-dark);
    min-height: 1.2em;
  }

  @media (prefers-reduced-motion: no-preference) {
    .status.show { animation: rise 0.25s ease; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <main class="card">
    <div class="wave" aria-hidden="true">
      <span style="height:8px"></span>
      <span style="height:16px"></span>
      <span style="height:24px"></span>
      <span style="height:12px"></span>
      <span style="height:20px"></span>
      <span style="height:9px"></span>
      <span style="height:18px"></span>
      <span style="height:14px"></span>
    </div>

    <h1>Listen, then write what you hear</h1>
    
    <audio controls preload="metadata">
      <source src="dictation-audio.mp3" type="audio/mpeg">
      Your browser doesn't support embedded audio. You can download the clip instead.
    </audio>
    <p class="hint">Tip: use the speed and seek controls to replay tricky parts.</p>

    <form id="dictationForm">
      <label for="words">Write the words</label>
      <textarea id="words" name="words" placeholder="Type what you heard here…" required></textarea>
      <button type="submit">Save my answer</button>
      <p class="status" id="status" role="status"></p>
    </form>
  </main>

<script>
  const form = document.getElementById('dictationForm');
  const status = document.getElementById('status');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    status.textContent = 'Saved — nice work.';
    status.classList.remove('show');
    void status.offsetWidth;
    status.classList.add('show');
  });
</script>

</body>
</html>
